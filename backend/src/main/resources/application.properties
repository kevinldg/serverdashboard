spring.application.name=backend

# Local development: load variables from the project-root .env (ignored if the file does not exist)
spring.config.import=optional:file:../.env[.properties]

spring.mongodb.uri=${MONGODB_URI}

# Initial admin user, created on startup if no admin exists yet
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}

# Docker Engine API: local socket in production, SSH tunnel (tcp://localhost:2375) during development
app.docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
app.docker.connect-timeout=5s
# Must be longer than the stop timeout, otherwise stopping a container is cut off client-side
app.docker.response-timeout=90s
# Grace period for a clean shutdown (e.g. game servers saving their world) before Docker kills the container
app.docker.stop-timeout=60s

# Container creation: host directory below which bind mounts are allowed; empty disables bind mounts
app.containers.bind-mount-root=${BIND_MOUNT_ROOT:}

# Live container logs (Server-Sent Events)
app.log-stream.max-duration=30m
app.log-stream.heartbeat-interval=15s
app.log-stream.max-concurrent=20

# Git commit of the running version, set at build time (shown on the system information page)
app.commit=${GIT_COMMIT:unknown}

server.servlet.session.cookie.same-site=lax
